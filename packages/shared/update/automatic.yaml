shared_update_automatic:
  automation:
    action:
      - variables:
          available_updates: >-
            {{ states.update
               | selectattr('state', 'eq', 'on')
               | map(attribute='entity_id')
               | list }}
      - if:
          - condition: template
            value_template: '{{ available_updates | count > 0 }}'
        then:
          - action: update.install
            data:
              backup: true
            target:
              entity_id: '{{ available_updates }}'
    alias: 'Update - Automatic'
    id: update_automatic
    trigger:
      - at: '00:00:00'
        platform: time
