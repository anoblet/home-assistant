shared_script_sqm_toggle:
  automation:
    - alias: SQM Toggle Start Loop
      id: shared_script_sqm_toggle_start_loop
      trigger:
        - platform: state
          entity_id: input_boolean.sqm_toggle
          to: 'on'
      action:
        - service: script.turn_on
          data:
            entity_id: script.sqm_toggle_loop
    - alias: SQM Toggle Stop Loop
      id: shared_script_sqm_toggle_stop_loop
      trigger:
        - platform: state
          entity_id: input_boolean.sqm_toggle
          to: 'off'
      action:
        - service: script.turn_off
          data:
            entity_id: script.sqm_toggle_loop
        - service: shell_command.sqm_disable
    - alias: SQM Toggle Schedule On
      id: shared_script_sqm_toggle_schedule_on
      trigger:
        - platform: time
          at: input_datetime.sqm_toggle_on
      action:
        - service: input_boolean.turn_on
          data:
            entity_id: input_boolean.sqm_toggle
    - alias: SQM Toggle Schedule Off
      id: shared_script_sqm_toggle_schedule_off
      trigger:
        - platform: time
          at: input_datetime.sqm_toggle_off
      action:
        - service: input_boolean.turn_off
          data:
            entity_id: input_boolean.sqm_toggle
  input_boolean:
    sqm_toggle:
      name: SQM Toggle
  script:
    sqm_toggle_loop:
      alias: SQM Toggle Loop
      sequence:
        - repeat:
            sequence:
              - variables:
                  interval_min_seconds: >-
                    {{ states('input_number.sqm_toggle_interval_min_seconds') | int(300) }}
                  interval_max_seconds: >-
                    {{ states('input_number.sqm_toggle_interval_max_seconds') | int(600) }}
                  active_window_min_seconds: >-
                    {{ states('input_number.sqm_toggle_active_window_min_seconds') | int(60) }}
                  active_window_max_seconds: >-
                    {{ states('input_number.sqm_toggle_active_window_max_seconds') | int(120) }}
              - variables:
                  next_interval_seconds: >-
                    {% set interval_lower_seconds = [interval_min_seconds, interval_max_seconds] | min %}
                    {% set interval_upper_seconds = [interval_min_seconds, interval_max_seconds] | max %}
                    {{ range(interval_lower_seconds, interval_upper_seconds + 1) | random }}
                  active_window_seconds: >-
                    {% set active_window_lower_seconds = [active_window_min_seconds, active_window_max_seconds] | min %}
                    {% set active_window_upper_seconds = [active_window_min_seconds, active_window_max_seconds] | max %}
                    {{ range(active_window_lower_seconds, active_window_upper_seconds + 1) | random }}
              - wait_for_trigger:
                  - platform: state
                    entity_id: input_boolean.sqm_toggle
                    to: 'off'
                timeout:
                  seconds: '{{ next_interval_seconds }}'
                continue_on_timeout: true
              - condition: state
                entity_id: input_boolean.sqm_toggle
                state: 'on'
              - service: shell_command.sqm_enable
              - wait_for_trigger:
                  - platform: state
                    entity_id: input_boolean.sqm_toggle
                    to: 'off'
                timeout:
                  seconds: '{{ active_window_seconds }}'
                continue_on_timeout: true
              - service: shell_command.sqm_disable
            while:
              - condition: state
                entity_id: input_boolean.sqm_toggle
                state: 'on'
