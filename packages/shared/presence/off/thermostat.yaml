shared_presence_off_thermostat:
  automation:
    actions:
      - action: climate.turn_off
        target:
          entity_id:
            - climate.living_room_thermostat_cool
            - climate.living_room_thermostat_heat
    alias: Common - Presence - Off - Thermostat
    id: common_presence_off_thermostat
    conditions:
      - condition: state
        entity_id: input_boolean.living_room_presence_detection
        state: 'on'
    triggers:
      - entity_id: binary_sensor.common_presence
        for:
          seconds: 15
        trigger: state
        to: 'off'
