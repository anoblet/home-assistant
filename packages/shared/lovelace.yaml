shared_lovelace:
  lovelace:
    dashboards:
      dashboard-room:
        filename: includes/lovelace/dashboards/dashboard_room.yaml
        mode: yaml
        title: Rooms
        icon: mdi:floor-plan
      dashboard-devices:
        filename: includes/lovelace/dashboards/dashboard_device.yaml
        mode: yaml
        title: Devices
        icon: mdi:chip
      # `lovelace` is the reserved url_path for the default dashboard. Defining
      # it here overrides the empty default Overview that Home Assistant would
      # otherwise auto-create from the unused `ui-lovelace.yaml` in yaml mode.
      lovelace:
        filename: includes/lovelace/dashboards/dashboard_overview.yaml
        mode: yaml
        title: Overview
        icon: mdi:home
    mode: yaml
