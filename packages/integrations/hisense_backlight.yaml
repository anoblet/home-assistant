integrations_hisense_backlight:
  shell_command:
    hisense_backlight_set: >-
      python3 /config/bin/hisense_backlight.py
      {{ states('input_text.hisense_backlight_host') | to_json }}
      {{ level | int(-1) }}
  script:
    hisense_backlight_set:
      alias: Hisense - Backlight - Set
      mode: queued
      fields:
        level:
          required: true
          selector:
            number:
              min: 0
              max: 100
              step: 1
      sequence:
        - condition: template
          value_template: >-
            {{ has_value('input_text.hisense_backlight_host')
               and states('input_text.hisense_backlight_host') is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
               and is_number(level) and 0 <= level | float <= 100
               and level | float == level | int }}
        - action: shell_command.hisense_backlight_set
          data:
            level: '{{ level }}'
          response_variable: result
        - if:
            - condition: template
              value_template: '{{ result.returncode != 0 }}'
          then:
            - stop: 'Hisense backlight command failed; inspect the shell command response.'
              error: true
  automation:
    - id: hisense_backlight_sunset
      alias: Hisense - Backlight - Sunset
      trigger:
        - platform: sun
          event: sunset
      condition:
        - condition: template
          value_template: '{{ is_number(states("input_number.hisense_backlight_sunset")) }}'
      action:
        - action: script.hisense_backlight_set
          data:
            level: '{{ states("input_number.hisense_backlight_sunset") | int }}'
    - id: hisense_backlight_sunrise
      alias: Hisense - Backlight - Sunrise
      trigger:
        - platform: sun
          event: sunrise
      condition:
        - condition: template
          value_template: '{{ is_number(states("input_number.hisense_backlight_sunrise")) }}'
      action:
        - action: script.hisense_backlight_set
          data:
            level: '{{ states("input_number.hisense_backlight_sunrise") | int }}'
