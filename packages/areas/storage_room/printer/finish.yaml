storage_room_printer_finish:
  automation:
    action:
      - if:
          - condition: template
            value_template: "{{ has_value('fan.storage_room_air_purifier') }}"
        then:
          - action: fan.set_preset_mode
            data:
              preset_mode: auto
            target:
              entity_id: fan.storage_room_air_purifier
      - if:
          - condition: template
            value_template: "{{ has_value('fan.x1c_00m00a2c0619044_chamber_fan') }}"
        then:
          - action: fan.turn_on
            target:
              entity_id: fan.x1c_00m00a2c0619044_chamber_fan
      - delay: '00:01:00'
      - if:
          - condition: template
            value_template: "{{ has_value('fan.x1c_00m00a2c0619044_chamber_fan') }}"
        then:
          - action: fan.turn_off
            target:
              entity_id: fan.x1c_00m00a2c0619044_chamber_fan
      - service: switch.turn_off
        target:
          entity_id: switch.storage_room_printer_switch
      - delay:
          seconds: 10
      - service: switch.turn_on
        target:
          entity_id: switch.storage_room_printer_switch
      - delay:
          minutes: 5
      # Send mobile notification
      - action: notify.mobile_app_pixel_6_pro
        data:
          message: 'Printing has finished'
    alias: Storage Room - Printer - Finish
    id: storage_room_printer_finish
    trigger:
      - to: 'finish'
        entity_id: sensor.x1c_00m00a2c0619044_print_status
        platform: state
