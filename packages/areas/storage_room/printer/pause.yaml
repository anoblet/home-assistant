storage_room_printer_pause:
  automation:
    actions:
      # Notify when the printer is paused
      - action: notify.mobile_app_pixel_6_pro
        data:
          message: 'The printer is paused'
    alias: 'Storage Room - Printer - Pause'
    id: storage_room_printer_pause
    trigger:
      - to: 'pause'
        entity_id: sensor.x1c_00m00a2c0619044_print_status
        platform: state
