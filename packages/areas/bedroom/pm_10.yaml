bedroom_pm_10:
  automation:
    alias: 'Bedroom - PM 10'
    id: bedroom_pm_10
    trigger:
      platform: numeric_state
      entity_id: sensor.bedroom_sen55_pm_10
      above: 150
    action:
      action: notify.mobile_app_pixel_4_xl
      data:
        message: "The PM10 value is {{ states('sensor.bedroom_sen55_pm_10') }}"
