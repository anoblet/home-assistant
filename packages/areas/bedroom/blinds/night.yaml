bedroom_blinds_night:
  automation:
    - alias: Bedroom - Blinds - Night
      id: bedroom_blinds_night
      mode: single
      description: 'Close bedroom blinds at 10 PM'
      trigger:
        - platform: time
          at: '22:00:00'
      action:
        - service: cover.close_cover
          target:
            entity_id: cover.bedroom_blinds
