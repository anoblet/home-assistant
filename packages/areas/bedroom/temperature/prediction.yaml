bedroom_temperature_prediction:
  template:
    - sensor:
        - name: 'Bedroom Temperature Prediction'
          unique_id: bedroom_temperature_prediction
          unit_of_measurement: '°F'
          device_class: temperature
          state: >
            {% set current = states('sensor.bedroom_temperature') | float(0) %}
            {% set rate = states('sensor.bedroom_temperature_rate') | float(0) %}
            {{ (current + rate) | round(1) }}
