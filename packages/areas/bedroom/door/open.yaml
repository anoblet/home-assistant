bedroom_door_open:
  automation:
    - id: bedroom_door_open
      alias: Bedroom - Door - Open
      trigger:
        - platform: state
          entity_id: binary_sensor.bedroom_door_contact
          from: 'off'
          to: 'on'
      condition:
        - condition: not
          conditions:
            - condition: zone
              entity_id: device_tracker.pixel_6_pro
              zone: zone.home
      action:
        - service: notify.mobile_app_pixel_6_pro
          data:
            title: Bedroom Door
            message: Bedroom door is open
