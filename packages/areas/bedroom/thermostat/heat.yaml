bedroom_thermostat_heat:
  climate:
    - cold_tolerance: 0
      heater: switch.bedroom_heater_switch
      hot_tolerance: 0
      name: Bedroom Thermostat Heat
      platform: generic_thermostat
      target_sensor: sensor.bedroom_temperature
      unique_id: bedroom_thermostat_heat
  google_assistant:
    entity_config:
      climate.bedroom_thermostat_heat:
        expose: true
