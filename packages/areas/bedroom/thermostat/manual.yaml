bedroom_thermostat_manual:
  automation:
    - action:
        - data:
            entity_id: input_boolean.bedroom_thermostat_manual
          service: input_boolean.turn_on
      alias: Bedroom - Thermostat - Manual
      condition:
        - condition: template
          value_template: '{{ trigger.to_state.context.user_id != None }}'
      id: bedroom_thermostat_manual
      trigger:
        - entity_id:
            - climate.bedroom_thermostat
          platform: state
    - action:
        - data:
            entity_id: input_boolean.bedroom_thermostat_manual
          service: input_boolean.turn_off
      alias: Bedroom - Thermostat - Manual - Reset
      id: bedroom_thermostat_manual_reset
      trigger:
        - entity_id: climate.bedroom_thermostat
          platform: state
          to: 'off'
        - entity_id: binary_sensor.bedroom_presence_presence
          platform: state
          to: 'off'
          for:
            minutes: 15
        - platform: state
          entity_id: input_boolean.bedroom_thermostat_manual
          to: 'on'
          for:
            hours: 1
  input_boolean:
    bedroom_thermostat_manual:
      initial: false
      name: Bedroom Thermostat Manual
