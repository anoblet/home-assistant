bedroom_thermostat_heat_default:
  automation:
    - alias: 'Bedroom - Thermostat - Heat - Default Reset'
      id: bedroom_thermostat_heat_default_reset
      trigger:
        - platform: time_pattern
          hours: '*'
          minutes: '0'
          seconds: '0'
        # Trigger when bedroom presence is off for 15 minutes
        - platform: state
          entity_id: binary_sensor.bedroom_presence_presence
          to: 'off'
          for:
            minutes: 15
      action:
        - variables:
            heat_default: >-
              input_number.bedroom_thermostat_heat_default_{{ 'day' if is_state('schedule.day', 'on') else 'night' }}
        - condition: template
          value_template: >-
            {{ states(heat_default) | is_number }}
        - service: climate.set_temperature
          target:
            entity_id: climate.bedroom_thermostat_heat
          data:
            temperature: '{{ states(heat_default) | float }}'
