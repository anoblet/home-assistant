bedroom_thermostat_heat_default:
  automation:
    - alias: 'Bedroom - Thermostat - Heat - Default Reset'
      id: bedroom_thermostat_heat_default_reset
      trigger:
        - platform: time_pattern
          hours: '*'
          minutes: '0'
          seconds: '0'
        # Trigger when bedroom presence is off for 15 minutes
        - platform: state
          entity_id: binary_sensor.bedroom_presence_presence
          to: 'off'
          for:
            minutes: 15
      action:
        - condition: template
          value_template: >-
            {{ states('input_number.bedroom_thermostat_heat_default') | is_number }}
        - service: climate.set_temperature
          target:
            entity_id: climate.bedroom_thermostat_heat
          data:
            temperature: "{{ states('input_number.bedroom_thermostat_heat_default') | float }}"
