bedroom_air_conditioner_virtual:
  google_assistant:
    entity_config:
      switch.bedroom_air_conditioner_virtual:
        expose: true
        name: Bedroom Air Conditioner
  template:
    - switch:
        - name: Bedroom Air Conditioner Virtual
          turn_on:
            action: script.turn_on
            target:
              entity_id: script.bedroom_air_conditioner_on
          turn_off:
            action: script.turn_on
            target:
              entity_id: script.bedroom_air_conditioner_off
