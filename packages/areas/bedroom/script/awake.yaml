bedroom_script_awake:
  google_assistant:
    entity_config:
      script.bedroom_awake:
        expose: true
  script:
    bedroom_awake:
      alias: Bedroom - Awake
      sequence:
        - service: light.turn_off
          data:
            transition: 300
          target:
            entity_id: light.bedroom_lamp_group_zigbee
