# Relies on packages/shared/presence/detection.yaml for the shared helper.
bedroom_presence_detection:
  google_assistant:
    entity_config:
      input_boolean.bedroom_presence_detection:
        expose: true
        name: Bedroom Presence Detection
  input_boolean:
    bedroom_presence_detection:
      name: Bedroom Presence Detection
      initial: on
      icon: mdi:motion-sensor
