bedroom_presence_off_thermostat:
  automation:
    action:
      - service: climate.set_temperature
        target:
          entity_id: climate.bedroom_thermostat_heat
        data:
          temperature: "{{ states('input_number.bedroom_thermostat_presence_off_heat') | float(68) }}"
      - service: climate.set_temperature
        target:
          entity_id: climate.bedroom_thermostat_cool
        data:
          temperature: "{{ states('input_number.bedroom_thermostat_presence_off_cool') | float(78) }}"
    alias: Bedroom - Presence - Off - Thermostat
    condition:
      - condition: state
        entity_id: input_boolean.bedroom_presence_detection
        state: 'on'
      - condition: state
        entity_id: input_boolean.bedroom_thermostat_manual
        state: 'off'
    id: bedroom_presence_off_thermostat
    trigger:
      - entity_id: binary_sensor.bedroom_presence_presence
        for:
          minutes: 1
        platform: state
        to: 'off'
