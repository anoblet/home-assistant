bathroom_light:
  automation:
    - action:
        - condition: state
          entity_id: binary_sensor.bathroom_door_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.bathroom_motion_occupancy
          state: 'off'
        - delay:
            seconds: "{{ states('input_number.bathroom_light_restore_delay') | int(60) }}"
        - service: light.turn_off
          target:
            entity_id: light.bathroom_light_group_zigbee
        - service: light.turn_on
          data:
            brightness_pct: "{{ states('input_number.bathroom_light_restore_brightness') | int(100) }}"
            color_temp: "{{ states('input_number.bathroom_light_restore_color_temp') | int(153) }}"
          target:
            entity_id: light.bathroom_light_group_zigbee
      alias: Bathroom - Light
      id: bathroom_light
      trigger:
        - platform: time_pattern
          minutes: 0
