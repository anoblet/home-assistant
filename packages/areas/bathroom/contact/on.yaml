bathroom_contact_on:
  automation:
    - action:
        - service: switch.turn_off
          entity_id: switch.bathroom_exhaust_fan
      alias: 'Bathroom Door On Exhaust Fan'
      id: bathroom_door_on_exhaust_fan
      trigger:
        entity_id: binary_sensor.bathroom_door_contact
        for:
          seconds: "{{ states('input_number.bathroom_exhaust_fan_door_open_delay') | int(120) }}"
        platform: state
        to: 'on'
