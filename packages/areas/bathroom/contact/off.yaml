bathroom_contact_off:
  automation:
    - action:
        - service: switch.turn_on
          entity_id: switch.bathroom_exhaust_fan
      alias: 'Bathroom Door Off Exhaust Fan'
      id: bathroom_door_off_exhaust_fan
      trigger:
        entity_id: binary_sensor.bathroom_door_contact
        for:
          seconds: "{{ states('input_number.bathroom_exhaust_fan_door_closed_delay') | int(5) }}"
        platform: state
        to: 'off'
