areas_bathroom_contact_off:
  automation:
    - action:
        - service: switch.turn_on
          entity_id: switch.bathroom_exhaust_fan
      alias: 'Bathroom Door Off Exhaust Fan'
      id: bathroom_door_off_exhaust_fan
      mode: single
      trigger:
        entity_id: binary_sensor.bathroom_door_contact
        for:
          seconds: 5
        platform: state
        to: 'off'
