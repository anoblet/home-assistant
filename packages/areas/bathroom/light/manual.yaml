bathroom_light_manual:
  automation:
    action:
      - delay:
          seconds: "{{ states('input_number.bathroom_light_manual_delay') | int(5) }}"
      - condition: state
        entity_id: light.bathroom_light_group_zigbee
        state: 'on'
      - data:
          entity_id: input_boolean.bathroom_light_manual
        service: input_boolean.turn_on
    alias: Bathroom Light Manual
    condition:
      - condition: template
        value_template: '{{ trigger.to_state.context.user_id != None }}'
    id: bathroom_light_manual
    trigger:
      - entity_id:
          - light.bathroom_light_group_zigbee
        platform: state
  input_boolean:
    bathroom_light_manual:
      name: Bathroom Light Manual
  input_number:
    bathroom_light_manual_delay:
      initial: 5
      max: 600
      min: 0
      mode: box
      name: Bathroom Light Manual Delay
      unit_of_measurement: 's'
