bathroom_light_manual:
  automation:
    action:
      - condition: template
        value_template: >-
          {{ states('input_number.bathroom_light_manual_delay') | is_number }}
      - delay:
          seconds: "{{ states('input_number.bathroom_light_manual_delay') | int }}"
      - condition: state
        entity_id: light.bathroom_light_group_zigbee
        state: 'on'
      - data:
          entity_id: input_boolean.bathroom_light_manual
        service: input_boolean.turn_on
    alias: Bathroom Light Manual
    condition:
      - condition: template
        value_template: '{{ trigger.to_state.context.user_id != None }}'
    id: bathroom_light_manual
    trigger:
      - entity_id:
          - light.bathroom_light_group_zigbee
        platform: state
