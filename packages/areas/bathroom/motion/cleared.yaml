bathroom_motion_cleared:
  automation:
    action:
      - data_template:
          transition: "{{ states('input_number.bathroom_light_transition_off') | int(0) }}"
        service: light.turn_off
        target:
          entity_id: light.bathroom_light_group_zigbee
    alias: Bathroom - Motion - Cleared
    condition:
      - condition: state
        entity_id: binary_sensor.bathroom_door_contact
        state: 'on'
    id: bathroom_motion_cleared
    trigger:
      - entity_id: binary_sensor.bathroom_motion_occupancy
        for: 00:{{ states('input_number.bathroom_motion_cooldown') | int(0) }}:00
        platform: state
        to: 'off'
