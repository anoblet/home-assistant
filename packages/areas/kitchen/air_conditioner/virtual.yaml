kitchen_air_conditioner_virtual:
  google_assistant:
    entity_config:
      switch.kitchen_air_conditioner_virtual:
        expose: true
        name: Kitchen Air Conditioner
  template:
    - switch:
        - name: Kitchen Air Conditioner Virtual
          turn_on:
            action: climate.turn_on
            target:
              entity_id: climate.kitchen_air_conditioner
          turn_off:
            action: climate.turn_off
            target:
              entity_id: climate.kitchen_air_conditioner
          state: "{{ is_state('climate.kitchen_air_conditioner', 'cool') }}"
