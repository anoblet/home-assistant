areas_living_room_presence_off_tv:
  automation:
    action:
      - service: media_player.pause
        target:
          entity_id:
            - media_player.living_room_tv_2
    alias: Living Room - Presence - Off - TV
    description: Pause living room TV when presence is no longer detected
    id: living_room_ld2410c_off_tv
    mode: single
    trigger:
      - entity_id: binary_sensor.living_room_ld2410c_presence
        platform: state
        to: 'off'
