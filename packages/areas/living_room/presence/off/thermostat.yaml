living_room_presence_off_thermostat:
  automation:
    action:
      - service: climate.set_temperature
        target:
          entity_id: climate.living_room_thermostat_heat
        data:
          temperature: "{{ states('input_number.living_room_thermostat_presence_off_heat') | float(68) }}"
      - service: climate.set_temperature
        target:
          entity_id: climate.living_room_thermostat_cool
        data:
          temperature: "{{ states('input_number.living_room_thermostat_presence_off_cool') | float(78) }}"
    alias: Living Room - Presence - Off - Thermostat
    condition:
      - condition: state
        entity_id: input_boolean.living_room_presence_detection
        state: 'on'
      - condition: state
        entity_id: input_boolean.living_room_thermostat_manual
        state: 'off'
    id: living_room_presence_off_thermostat
    trigger:
      - entity_id: binary_sensor.living_room_presence_presence
        for:
          minutes: 1
        platform: state
        to: 'off'
