living_room_presence_on_thermostat:
  automation:
    action:
      - service: climate.turn_on
        target:
          entity_id:
            - climate.living_room_thermostat_cool
            - climate.living_room_thermostat_heat
    alias: Living Room - Presence - On - Thermostat
    condition:
      - condition: state
        entity_id: input_boolean.living_room_presence_detection
        state: 'on'
      - condition: state
        entity_id: input_boolean.living_room_thermostat_manual
        state: 'off'
    id: living_room_presence_on_thermostat
    trigger:
      - entity_id: binary_sensor.living_room_presence_presence
        from: 'off'
        for:
          minutes: 1
        platform: state
        to: 'on'
