living_room_blinds_manual:
  automation:
    - action:
        - data:
            entity_id: input_boolean.living_room_blinds_automatic
          service: input_boolean.turn_off
      alias: Living Room - Blinds - Manual
      condition:
        - condition: template
          value_template: '{{ trigger.to_state.context.user_id != None }}'
      id: living_room_blinds_manual
      trigger:
        - entity_id:
            - cover.living_room_blinds
            - cover.living_room_blind_one
            - cover.living_room_blind_two
            - cover.living_room_blind_three
          platform: state
    - action:
        - data:
            entity_id: input_boolean.living_room_blinds_automatic
          service: input_boolean.turn_on
      alias: Living Room - Blinds - Manual - Reset
      condition:
        - condition: template
          value_template: "{{ is_state('sensor.season', 'summer') }}"
      id: living_room_blinds_manual_reset
      trigger:
        - platform: time
          at: '12:00:00'
