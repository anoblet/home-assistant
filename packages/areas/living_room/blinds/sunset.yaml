living_room_blinds_sunset:
  automation:
    - action:
        # Turn off the automatic blinds
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.living_room_blinds_automatic
        # Set the blinds position based on the input number
        - action: cover.set_cover_position
          data:
            position: "{{ states('input_number.living_room_blinds_sunset_position') | int }}"
          target:
            entity_id: cover.living_room_blinds
      alias: Living Room - Blinds - Sunset
      id: living_room_blinds_sunset
      trigger:
        - event: sunset
          platform: sun
