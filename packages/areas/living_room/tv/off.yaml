areas_living_room_tv_off:
  automation:
    - action:
        # Turn on adaptive lighting
        - action: adaptive_lighting.set_manual_control
          data:
            entity_id: switch.adaptive_lighting_living_room
            manual_control: false
        # If it is summer, turn on automatic blinds, otherwise open the blinds
        - if:
            - condition: template
              value_template: "{{ states('sensor.season') == 'summer' }}"
          then:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.living_room_blinds_automatic
          else:
            - action: cover.open_cover
              target:
                entity_id: cover.living_room_blinds
      alias: Living Room - TV - Off
      id: living_room_tv_off
      trigger:
        - entity_id: remote.living_room_tv
          platform: state
          to: 'off'
