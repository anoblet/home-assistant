living_room_tv_off_blinds:
  automation:
    action:
      # If it is summer, turn on automatic blinds, otherwise open the blinds
      - if:
          - condition: template
            value_template: "{{ states('sensor.season') == 'summer' }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.living_room_blinds_automatic
        else:
          - action: cover.open_cover
            target:
              entity_id: cover.living_room_blinds
    alias: Living Room - TV - Off - Blinds
    id: living_room_tv_off_blinds
    trigger:
      - entity_id: remote.living_room_tv
        platform: state
        to: 'off'
