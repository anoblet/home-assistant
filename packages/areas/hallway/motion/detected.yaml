hallway_motion_detected:
  automation:
    - action:
        - data:
            entity_id: light.hallway_light_group_zigbee
            transition: "{{ states('input_number.hallway_light_transition_on') | int(0) }}"
          service: light.turn_on
      alias: Hallway - Motion - Detected
      condition:
        - condition: state
          entity_id: input_boolean.hallway_light_manual
          state: 'off'
        - condition: template
          value_template: "{{ (states('sensor.hallway_motion_one_illuminance') | int(0)) < (states('input_number.hallway_motion_illuminance_minimum') | int(0)) }}"
      id: hallway_motion_detected
      trigger:
        - entity_id: binary_sensor.hallway_motion_occupancy_group
          platform: state
          to: 'on'
