bathroom_contact_off:
  automation:
    - action:
        - service: switch.turn_on
          entity_id: switch.bathroom_exhaust_fan
      alias: "Bathroom Door Off Exhaust Fan"
      id: bathroom_contact_off
      mode: single
      trigger:
        entity_id: binary_sensor.bathroom_contact_open
        for:
          seconds: 5
        platform: state
        to: "off"
