reminders_todo:
  automation:
    # Reminds about every pending to-do item while the helper is enabled
    - alias: 'To-do Task Reminder'
      id: 'reminders_todo_task_reminder'
      description: 'Sends repeating reminders for pending tasks from the My Tasks list while the reminder helper is enabled.'
      trigger:
        - platform: time_pattern
          minutes: '/30'
        - platform: state
          entity_id: input_boolean.homeassistant_todo_reminder
          to: 'on'
      condition:
        - condition: state
          entity_id: input_boolean.homeassistant_todo_reminder
          state: 'on'
      variables:
        todo_entity: 'todo.my_tasks'
        list_name: >-
          {{ state_attr(todo_entity, 'friendly_name') or todo_entity | replace('todo.', '') | replace('_', ' ') | title }}
        notification_tag: >-
          {{ 'todo-reminder-' ~ (todo_entity | replace('todo.', '') | replace('_', '-')) }}
        todo_url: >-
          {{ 'https://31w3e.andrewnoblet.com/todo?entity_id=' ~ todo_entity }}
      action:
        - choose:
            - conditions:
                - condition: template
                  value_template: >-
                    {{ states(todo_entity) not in ['unknown', 'unavailable'] }}
              sequence:
                - service: todo.get_items
                  data:
                    entity_id: '{{ todo_entity }}'
                    status:
                      - 'needs_action'
                  response_variable: pending_list
                - variables:
                    pending_items: >-
                      {{ pending_list.get(todo_entity, {}).get('items', []) }}
                    notification_message: >-
                      {% set lines = [list_name ~ ' — Pending Tasks'] %}
                      {% if pending_items %}
                        {% set _ = lines.append('') %}
                        {% for item in pending_items %}
                          {% set _ = lines.append('• ' ~ item.summary) %}
                        {% endfor %}
                      {% else %}
                        {% set _ = lines.append('') %}
                        {% set _ = lines.append('No pending tasks 🎉') %}
                      {% endif %}
                      {{ lines | join('\n') }}
                - choose:
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ pending_items | length > 0 }}
                      sequence:
                        - service: persistent_notification.create
                          data:
                            title: 'To-do Reminder'
                            message: >-
                              {{ notification_message }}
                            notification_id: '{{ notification_tag }}'
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ 'mobile_app_pixel_4' in services.get('notify', {}) }}
                              sequence:
                                - service: notify.mobile_app_pixel_4_xl
                                  data:
                                    title: 'To-do Reminder'
                                    message: >-
                                      {{ notification_message }}
                                    data:
                                      tag: '{{ notification_tag }}'
                                      url: '{{ todo_url }}'
                                      clickAction: '{{ todo_url }}'
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ 'mobile_app_pixel_4_xl' in services.get('notify', {}) }}
                              sequence:
                                - service: notify.mobile_app_pixel_4_xl
                                  data:
                                    title: 'To-do Reminder'
                                    message: >-
                                      {{ notification_message }}
                                    data:
                                      tag: '{{ notification_tag }}'
                                      url: '{{ todo_url }}'
                                      clickAction: '{{ todo_url }}'
                          default:
                            - service: notify.notify
                              data:
                                title: 'To-do Reminder'
                                message: >-
                                  {{ notification_message }}
                                data:
                                  tag: '{{ notification_tag }}'
                                  url: '{{ todo_url }}'
                                  clickAction: '{{ todo_url }}'
  input_boolean:
    homeassistant_todo_reminder:
      name: 'To-do Reminders'
      icon: 'mdi:clipboard-check-outline'
      initial: 'on'
