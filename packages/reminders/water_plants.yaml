reminders_water_plants:
  automation:
    - id: water_plants_daily_reminder
      alias: Water Plants Daily Reminder
      description: Remind daily when due until watering the plants is confirmed.
      trigger:
        - platform: time
          at: input_datetime.water_plants_reminder_time
      condition:
        - condition: template
          value_template: >-
            {% set last = as_datetime(states('input_datetime.water_plants_last_confirmed'), none) %}
            {% set interval = states('input_number.water_plants_interval_days') | int(0) %}
            {{ last is not none and interval > 0 and
               (now().date() - last.date()).days >= interval }}
      action:
        - action: notify.mobile_app_pixel_6_pro
          data:
            title: Water the plants
            message: Water your plants, then confirm below.
            data:
              tag: water-plants-reminder
              actions:
                - action: WATER_PLANTS_DONE
                  title: Plants watered
    - id: water_plants_notification_action
      alias: Water Plants Notification Action
      trigger:
        - platform: event
          event_type: mobile_app_notification_action
          event_data:
            action: WATER_PLANTS_DONE
      action:
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.water_plants_last_confirmed
          data:
            datetime: '{{ now().strftime("%Y-%m-%d %H:%M:%S") }}'
        - action: notify.mobile_app_pixel_6_pro
          data:
            message: clear_notification
            data:
              tag: water-plants-reminder
