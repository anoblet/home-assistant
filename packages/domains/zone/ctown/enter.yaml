domains_zone_ctown_enter:
  automation:
    - alias: 'Zone - CTown - Enter'
      id: zone_ctown_enter
      description: 'Send a notification when entering CTown with a quick link to the shopping list.'
      trigger:
        - platform: zone
          entity_id: device_tracker.pixel_4_xl
          zone: zone.ctown
          event: enter
      action:
        - service: notify.mobile_app_pixel_4_xl
          data:
            title: 'CTown Arrival'
            message: 'You just arrived at CTown.'
            data:
              actions:
                - action: URI
                  title: 'Open Shopping List'
                  uri: 'https://31w3e.andrewnoblet.com/todo?entity_id=todo.google_keep_shopping'
              channel: Location
