apexcharts_card_templates: !include_dir_named ../apexcharts_card_templates
title: Devices
views:
  - title: Overview
    path: devices_overview
    icon: mdi:view-dashboard-variant
    type: custom:default-view
    cards:
      - type: custom:generic-card
        style:
          'background-color': 'initial'
        cards:
          - type: custom:flex-card
            style:
              '--flex-card-min-width': '320px'
              '--flex-card-max-width': '100vw'
              'gap': '1rem'
            cards:
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(300px, auto))'
                cards:
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Updates Available
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - domain: update
                          state: 'on'
                      exclude: []
                    show_empty: false
                    sort:
                      method: name

                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Attention Required
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - state: 'unavailable'
                        - state: 'unknown'
                    exclude:
                      - domain: group
                      - domain: scene
                      - domain: automation
                      - domain: script
                      - entity_id: '*_browser'
                      - entity_id: 'sensor.date*'
                      - entity_id: 'sensor.time*'
                    show_empty: false
                    sort:
                      method: name

                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Critical Batteries
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - entity_id: '*_battery'
                          state: '<= 20'
                    show_empty: false
                    sort:
                      method: state

  - title: Lights
    path: devices_lights
    icon: mdi:lightbulb-group
    type: custom:default-view
    cards:
      - type: custom:generic-card
        style:
          'background-color': 'initial'
        cards:
          - type: custom:flex-card
            style:
              '--flex-card-min-width': '320px'
              '--flex-card-max-width': '100vw'
              'gap': '1rem'
            cards:
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(256px, auto))'
                cards:
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Lights On
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - domain: light
                          state: 'on'
                    sort:
                      method: name
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: All Lights
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - domain: light
                    sort:
                      method: name
