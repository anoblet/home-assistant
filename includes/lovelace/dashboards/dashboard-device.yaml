apexcharts_card_templates: !include_dir_named ../apexcharts_card_templates
title: Devices
views:
  - title: Summary
    path: devices_summary
    icon: mdi:view-dashboard
    type: custom:default-view
    cards:
      - type: custom:generic-card
        style:
          'background-color': 'initial'
        cards:
          - type: custom:flex-card
            style:
              '--flex-card-min-width': '320px'
              '--flex-card-max-width': '100vw'
              'gap': '1rem'
            cards:
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(192px, auto))'
                cards:
                  - type: tile
                    entity: light.bedroom_light_group
                    name: Bedroom Lights
                  - type: tile
                    entity: light.living_room_light_group_zigbee
                    name: Living Room Lights
                  - type: tile
                    entity: light.kitchen_light_group_zigbee
                    name: Kitchen Lights
                  - type: tile
                    entity: climate.bedroom_thermostat_heat
                    name: Bedroom Heat
                  - type: tile
                    entity: climate.bedroom_thermostat_cool
                    name: Bedroom Cool
                  - type: tile
                    entity: fan.bedroom_air_purifier
                    name: Bedroom Air Purifier
                  - type: tile
                    entity: fan.living_room_air_purifier
                    name: Living Room Air Purifier
                  - type: tile
                    entity: lock.back_door
                    name: Back Door
                  - type: tile
                    entity: binary_sensor.bedroom_ld2410c_presence
                    name: Bedroom Presence
                  - type: tile
                    entity: binary_sensor.living_room_ld2410c_presence
                    name: Living Room Presence
                  - type: tile
                    entity: binary_sensor.kitchen_presence_presence
                    name: Kitchen Presence

  - title: Lights
    path: devices_lights
    icon: mdi:lightbulb
    type: custom:default-view
    cards:
      - type: custom:generic-card
        style:
          'background-color': 'initial'
        cards:
          - type: custom:flex-card
            style:
              '--flex-card-min-width': '320px'
              '--flex-card-max-width': '100vw'
              'gap': '1rem'
            cards:
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(256px, auto))'
                cards:
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Lights On
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - domain: light
                          state: 'on'
                    sort:
                      method: name
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: All Lights
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - domain: light
                    sort:
                      method: name

  - title: Climate & Air
    path: devices_climate
    icon: mdi:weather-cloudy
    type: custom:default-view
    cards:
      - type: custom:generic-card
        style:
          'background-color': 'initial'
        cards:
          - type: custom:flex-card
            style:
              '--flex-card-min-width': '320px'
              '--flex-card-max-width': '100vw'
              'gap': '1rem'
            cards:
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(256px, auto))'
                cards:
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Thermostats
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - domain: climate
                    sort:
                      method: name
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Temperature & Humidity
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - entity_id: 'sensor.*temperature*'
                        - entity_id: 'sensor.*humidity*'
                    sort:
                      method: name
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Air Quality
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - entity_id: 'sensor.*pm_*'
                        - entity_id: 'sensor.*co2*'
                    sort:
                      method: name
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(256px, auto))'
                cards:
                  - type: custom:apexcharts-card
                    config_templates: climate
                    header:
                      show: true
                      title: Bedroom Climate History
                    series:
                      - entity: sensor.bedroom_climate_temperature
                        name: Temperature
                      - entity: sensor.bedroom_climate_humidity
                        name: Humidity
                      - entity: sensor.bedroom_climate_pressure
                        name: Pressure

  - title: Fans
    path: devices_fans
    icon: mdi:fan
    type: custom:default-view
    cards:
      - type: custom:generic-card
        style:
          'background-color': 'initial'
        cards:
          - type: custom:flex-card
            style:
              '--flex-card-min-width': '320px'
              '--flex-card-max-width': '100vw'
              'gap': '1rem'
            cards:
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(256px, auto))'
                cards:
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: All Fans
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - domain: fan
                    sort:
                      method: name
                  - type: entities
                    title: Key Fans
                    show_header_toggle: false
                    entities:
                      - entity: fan.bedroom_air_purifier
                        name: Bedroom Air Purifier
                      - entity: fan.living_room_air_purifier
                        name: Living Room Air Purifier

  - title: Security & Presence
    path: devices_security
    icon: mdi:shield-home
    type: custom:default-view
    cards:
      - type: custom:generic-card
        style:
          'background-color': 'initial'
        cards:
          - type: custom:flex-card
            style:
              '--flex-card-min-width': '320px'
              '--flex-card-max-width': '100vw'
              'gap': '1rem'
            cards:
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(256px, auto))'
                cards:
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Active Security Alerts
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - entity_id: 'binary_sensor.*_presence'
                          state: 'on'
                        - entity_id: 'binary_sensor.*presence_presence'
                          state: 'on'
                        - entity_id: 'binary_sensor.*_motion*'
                          state: 'on'
                        - entity_id: 'binary_sensor.*door*'
                          state: 'on'
                        - domain: lock
                          state: 'unlocked'
                    sort:
                      method: name
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Locks
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - domain: lock
                    sort:
                      method: name
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Motion & Presence Sensors
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - entity_id: 'binary_sensor.*_presence'
                        - entity_id: 'binary_sensor.*presence_presence'
                        - entity_id: 'binary_sensor.*_motion*'
                    sort:
                      method: name
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Doors & Contacts
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - entity_id: 'binary_sensor.*door*'
                    sort:
                      method: name

  - title: Batteries & Network
    path: devices_batteries
    icon: mdi:battery
    type: custom:default-view
    cards:
      - type: custom:generic-card
        style:
          'background-color': 'initial'
        cards:
          - type: custom:flex-card
            style:
              '--flex-card-min-width': '320px'
              '--flex-card-max-width': '100vw'
              'gap': '1rem'
            cards:
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(256px, auto))'
                cards:
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Low Batteries (≤ 30%)
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - entity_id: '*_battery'
                          state: '<= 30'
                    sort:
                      method: state
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: All Batteries
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - entity_id: '*_battery'
                    sort:
                      method: state
                      reverse: true
                  - type: entities
                    title: Network
                    show_header_toggle: false
                    entities:
                      - entity: sensor.speedtest_download
                        name: Download Speed
