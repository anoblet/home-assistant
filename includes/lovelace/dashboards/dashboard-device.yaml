apexcharts_card_templates: !include_dir_named ../apexcharts_card_templates
title: Devices
views:
  - title: Overview
    path: devices_overview
    icon: mdi:view-dashboard-variant
    type: custom:default-view
    cards:
      - type: custom:generic-card
        style:
          'background-color': 'initial'
        cards:
          - type: custom:flex-card
            style:
              '--flex-card-min-width': '320px'
              '--flex-card-max-width': '100vw'
              'gap': '1rem'
            cards:
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(300px, auto))'
                cards:
                  # Updates Section
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Updates Available
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - domain: update
                          state: 'on'
                      exclude: []
                    show_empty: false
                    sort:
                      method: name

                  # Problematic Devices
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Attention Required
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - state: 'unavailable'
                        - state: 'unknown'
                    exclude:
                      - domain: group
                      - domain: scene
                      - domain: automation
                      - domain: script
                      - entity_id: '*_browser'
                      - entity_id: 'sensor.date*'
                      - entity_id: 'sensor.time*'
                    show_empty: false
                    sort:
                      method: name

                  # Low Battery Summary
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Critical Batteries
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - entity_id: '*_battery'
                          state: '<= 20'
                    show_empty: false
                    sort:
                      method: state

  - title: Lights
    path: devices_lights
    icon: mdi:lightbulb-group
    type: custom:default-view
    cards:
      - type: custom:generic-card
        style:
          'background-color': 'initial'
        cards:
          - type: custom:flex-card
            style:
              '--flex-card-min-width': '320px'
              '--flex-card-max-width': '100vw'
              'gap': '1rem'
            cards:
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(256px, auto))'
                cards:
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Lights On
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - domain: light
                          state: 'on'
                    sort:
                      method: name
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: All Lights
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - domain: light
                    sort:
                      method: name

  - title: Climate
    path: devices_climate
    icon: mdi:thermostat
    type: custom:default-view
    cards:
      - type: custom:generic-card
        style:
          'background-color': 'initial'
        cards:
          - type: custom:flex-card
            style:
              '--flex-card-min-width': '320px'
              '--flex-card-max-width': '100vw'
              'gap': '1rem'
            cards:
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(256px, auto))'
                cards:
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Climate Devices
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - domain: climate
                    sort:
                      method: name
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Environmental Sensors
                      show_header_toggle: false
                    filter:
                      include:
                        - entity_id: 'sensor.*_temperature'
                        - entity_id: 'sensor.*_humidity'
                        - entity_id: 'sensor.*_co2'
                        - entity_id: 'sensor.*_pm25'
                    sort:
                      method: name

  - title: Security
    path: devices_security
    icon: mdi:shield-check
    type: custom:default-view
    cards:
      - type: custom:generic-card
        style:
          'background-color': 'initial'
        cards:
          - type: custom:flex-card
            style:
              '--flex-card-min-width': '320px'
              '--flex-card-max-width': '100vw'
              'gap': '1rem'
            cards:
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(256px, auto))'
                cards:
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Active Alerts
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - domain: lock
                          state: 'unlocked'
                        - domain: binary_sensor
                          attributes:
                            device_class: door
                          state: 'on'
                        - domain: binary_sensor
                          attributes:
                            device_class: window
                          state: 'on'
                        - domain: binary_sensor
                          attributes:
                            device_class: smoke
                          state: 'on'
                    show_empty: false
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Locks & Doors
                      show_header_toggle: false
                    filter:
                      include:
                        - domain: lock
                        - domain: binary_sensor
                          attributes:
                            device_class: door
                    sort:
                      method: name

  - title: Power & Network
    path: devices_power
    icon: mdi:battery-charging
    type: custom:default-view
    cards:
      - type: custom:generic-card
        style:
          'background-color': 'initial'
        cards:
          - type: custom:flex-card
            style:
              '--flex-card-min-width': '320px'
              '--flex-card-max-width': '100vw'
              'gap': '1rem'
            cards:
              - type: custom:grid-card
                style:
                  'gap': '1rem'
                  'grid-template-columns': 'repeat(auto-fit, minmax(256px, auto))'
                cards:
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Battery Levels
                      show_header_toggle: false
                      state_color: true
                    filter:
                      include:
                        - entity_id: '*_battery'
                      exclude:
                        - state: 'unavailable'
                        - state: 'unknown'
                    sort:
                      method: state
                      numeric: true
                  - type: custom:auto-entities
                    card:
                      type: entities
                      title: Signal Strength (LQI)
                      show_header_toggle: false
                    filter:
                      include:
                        - entity_id: 'sensor.*_linkquality'
                    sort:
                      method: state
                      numeric: true
                      reverse: true
