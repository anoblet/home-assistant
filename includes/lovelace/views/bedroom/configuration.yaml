path: bedroom-configuration
subview: true
title: Configuration
type: sections
sections:
  - type: grid
    title: Window Automation
    cards:
      - type: entities
        entities:
          - entity: input_boolean.bedroom_blinds_automatic
            name: Automatic Blinds
          - entity: input_number.bedroom_blinds_sunset_position
            name: Sunset Position
  - type: grid
    title: Occupancy
    cards:
      - type: entities
        entities:
          - entity: input_boolean.bedroom_presence_detection
            name: Presence Detection
  - type: grid
    title: Climate Control
    cards:
      - type: entities
        entities:
          - entity: input_select.bedroom_climate_zone
            name: Climate Zone
          - entity: switch.bedroom_air_conditioner_virtual
            name: Air Conditioner
          - entity: input_number.bedroom_thermostat_heat_default
            name: Thermostat Heat Default
          - entity: input_number.bedroom_thermostat_cool_default
            name: Thermostat Cool Default
  - type: grid
    title: Adaptive Lighting Modes
    cards:
      - type: entities
        entities:
          - entity: switch.adaptive_lighting_bedroom
            name: Adaptive Lighting
          - entity: switch.adaptive_lighting_adapt_brightness_bedroom
            name: Adaptive Lighting Brightness
          - entity: switch.adaptive_lighting_adapt_color_bedroom
            name: Adaptive Lighting Color
          - entity: switch.adaptive_lighting_sleep_mode_bedroom
            name: Adaptive Lighting Sleep Mode
