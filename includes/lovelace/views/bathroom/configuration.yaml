path: bathroom-configuration
subview: true
title: Configuration
type: sections
sections:
  - type: grid
    title: Lighting Timing & Restore
    cards:
      - type: entities
        entities:
          - entity: input_number.bathroom_light_transition_on
            name: Light Transition On
          - entity: input_number.bathroom_light_transition_off
            name: Light Transition Off
          - entity: input_number.bathroom_motion_cooldown
            name: Motion Cooldown
          - entity: input_number.bathroom_light_restore_delay
            name: Light Restore Delay
          - entity: input_number.bathroom_light_manual_delay
            name: Light Manual Delay
          - entity: input_number.bathroom_light_restore_brightness
            name: Light Restore Brightness
          - entity: input_number.bathroom_light_restore_color_temp
            name: Light Restore Color Temperature
  - type: grid
    title: Exhaust Fan Timing
    cards:
      - type: entities
        entities:
          - entity: input_number.bathroom_exhaust_fan_door_open_delay
            name: Exhaust Fan Door Open Delay
          - entity: input_number.bathroom_exhaust_fan_door_closed_delay
            name: Exhaust Fan Door Closed Delay
  - type: grid
    title: Adaptive Lighting Modes
    cards:
      - type: entities
        entities:
          - entity: switch.adaptive_lighting_bathroom
            name: Adaptive Lighting
          - entity: switch.adaptive_lighting_adapt_brightness_bathroom
            name: Adaptive Lighting Brightness
          - entity: switch.adaptive_lighting_adapt_color_bathroom
            name: Adaptive Lighting Color
          - entity: switch.adaptive_lighting_sleep_mode_bathroom
            name: Adaptive Lighting Sleep Mode
  - type: grid
    title: Adaptive Lighting Tuning
    cards:
      - type: entities
        entities:
          - entity: input_number.bathroom_adaptive_lighting_min_brightness
            name: Adaptive Lighting Minimum Brightness
          - entity: input_number.bathroom_adaptive_lighting_max_brightness
            name: Adaptive Lighting Maximum Brightness
          - entity: input_number.bathroom_adaptive_lighting_min_color_temp
            name: Adaptive Lighting Minimum Color Temperature
          - entity: input_number.bathroom_adaptive_lighting_max_color_temp
            name: Adaptive Lighting Maximum Color Temperature
          - entity: input_number.bathroom_adaptive_lighting_sleep_brightness
            name: Adaptive Lighting Sleep Brightness
          - entity: input_number.bathroom_adaptive_lighting_sleep_color_temp
            name: Adaptive Lighting Sleep Color Temperature
          - entity: input_number.bathroom_adaptive_lighting_sleep_transition
            name: Adaptive Lighting Sleep Transition
