title: Reminders
path: reminders
icon: mdi:bell-cog-outline
type: sections
sections:
  - type: grid
    title: Daily Reminders
    cards:
      - type: entities
        entities:
          - entity: input_boolean.brush_teeth_reminder
          - entity: input_boolean.my_tasks_reminder
  - type: grid
    title: Open Windows
    cards:
      - type: entities
        entities:
          - entity: input_datetime.open_windows_reminder_time
          - entity: input_number.open_windows_interval_days
          - entity: input_datetime.open_windows_last_confirmed
  - type: grid
    title: Water Plants
    cards:
      - type: entities
        entities:
          - entity: input_datetime.water_plants_reminder_time
          - entity: input_number.water_plants_interval_days
          - entity: input_datetime.water_plants_last_confirmed
